
data:
  coco_root: "./datasets/coco"
  subset_categories:
    - "bottle"
    - "cup"
    - "bowl"
    - "knife"
    - "scissors"
  max_train_images: 2000
  max_val_images: 500
  val_split: 0.2
  seed: 42

model:
  architecture: "yolov8n.pt"
  input_size: 640
  num_classes: 5

training:
  epochs: 50
  batch_size: 16
  learning_rate: 0.01
  optimizer: "SGD"
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3
  patience: 10
  save_period: 10
  workers: 2
  device: "0"

augmentation:
  horizontal_flip_prob: 0.5
  vertical_flip_prob: 0.0
  rotation_limit: 15
  brightness_limit: 0.2
  contrast_limit: 0.2
  blur_limit: 3
  noise_var_limit: 25.0

evaluation:
  confidence_threshold: 0.25
  iou_threshold: 0.45
  max_detections: 300

logging:
  wandb_project: "yolov8-defect-detection"
  wandb_entity: null
  log_images: true
  log_interval: 10

inference:
  confidence_threshold: 0.5
  iou_threshold: 0.45
  max_detections: 100
  output_dir: "./outputs/inference"

paths:
  output_dir: "./outputs"
  checkpoints_dir: "./outputs/checkpoints"
  logs_dir: "./outputs/logs"
  figures_dir: "./outputs/figures"
